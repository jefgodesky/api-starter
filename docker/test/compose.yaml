name: api_starter_test

volumes:
  db: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - postgres.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 1s
      timeout: 1s
      retries: 6

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: api
    ports:
      - '8001:8001'
    env_file:
      - postgres.env
      - api.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [
        'CMD',
        'deno',
        'run',
        '--allow-net',
        '--allow-env',
        'docker/healthcheck.ts',
      ]
      interval: 1s
      timeout: 1s
      retries: 6

  test:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: test
    env_file:
      - postgres.env
      - api.env
    depends_on:
      api:
        condition: service_healthy
    command: deno run test
