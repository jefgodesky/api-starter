not-found: '{key} does not exist.'
test:
  msg: Hello, world!
errors:
  schema:
    semver: "Invalid semantic version format. Version string must be of the form MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]."
  http:
    status:
      min: "A valid HTTP status must be 100 or greater."
      max: "A valid HTTP status must be 599 or less."
    notFound:
      title: "{Type} Not Found"
      detail: "The requested {type} at {context.req.path} could not be found."
    unauthorized:
      title: "Forbidden"
      detail: "You do not have permission to access the content at {context.req.path}."
    other:
      title: "Internal Server Error"
      detail: "Something has gone wrong. It’s probably a problem with the API, not your request."
docs:
  schemas:
    issue:
      target: "The part of the request where the issue arose."
      pointer: >
        An RFC 6901 JSON pointer to the value in question, relative to the
        `target`. An empty string means that part as a whole has an issue.
      detail: "A  human-readable explanation of the issue."
      code: >
        A machine-readable issue code. The set of possible responses includes
        Zod validation codes (e.g. `invalid_type`, `too_small`) alongside
        API-specific codes.
  root:
    get:
      200:
        main: >
          The API root returns a directory of available endpoints, both as a
          collection of `Link` headers and as a JSON record.
        key: "The name of the resource."
        uri: "The URI where that resource can be found."
        link: >
          A comma-separated list of links. See the
          [MDN documentation on the Link header](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Link).
