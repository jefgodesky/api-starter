name: api_starter_dev

volumes:
  db: {}

services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - postgres.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - '8000:80'
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../versions.json:/etc/nginx/api/versions.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/health']
      interval: 2s
      timeout: 2s
      retries: 15

  api-v1:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    container_name: api
    env_file:
      - postgres.env
      - nginx.env
      - api.env
    depends_on:
      postgres:
        condition: service_healthy
