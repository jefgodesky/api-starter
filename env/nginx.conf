map $status $error_title {
    400     "Bad Request";
    403     "Forbidden";
    404     "Not Found";
    405     "Method Not Allowed";
    408     "Request Timeout";
    413     "Content Too Large";
    414     "URI Too Long";
    431     "Request Header Fields Too Large";
    494     "Request Header Too Large";
    502     "Bad Gateway";
    503     "Service Unavailable";
    504     "Gateway Timeout";
    default "Internal Server Error";
}

map $status $error_detail {
    400     "The request could not be understood.";
    403     "You do not have permission to access the content.";
    404     "The requested resource could not be found.";
    405     "This method is not allowed on this resource.";
    408     "The server timed out waiting for the request.";
    413     "The request body is too large.";
    414     "The request URI is too long.";
    431     "The request headers are too large.";
    494     "The request headers are too large.";
    502     "The API version for this request is not responding.";
    503     "The service is temporarily unavailable.";
    504     "The API version for this request took too long to respond.";
    default "Something has gone wrong. It’s probably a problem with the API, not your request.";
}

map $request_uri $error_instance {
    ~^(?<path>[^?\x22\x5c]*)(?:\?.*)?$  $path;
    default                               "";
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;

    error_page 400 403 404 405 408 413 414 431 494 500 502 503 504 /_error;

    location = /_error {
        internal;
        types { }
        default_type application/problem+json;
        return 200 '{"title":"$error_title","detail":"$error_detail","instance":"$error_instance"}';
    }

    location / {
        return 404;
    }

    location = /health {
        access_log off;
        return 204;
    }

    location = / {
        root /etc/nginx/api;
        try_files /versions.json =404;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '{{ROOT}}' '$scheme://$http_host';
    }

    location ~ ^/(v\d+)(?:/|$) {
        proxy_pass http://api-$1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
