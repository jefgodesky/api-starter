name: api_starter_test

volumes:
  db: {}

services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - postgres.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 1s
      timeout: 1s
      retries: 6

  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - '8001:80'
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [ 'CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/health' ]
      interval: 2s
      timeout: 2s
      retries: 15

  api-v1:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
    container_name: api
    env_file:
      - postgres.env
      - nginx.env
      - api.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'env/healthcheck.ts']
      interval: 1s
      timeout: 1s
      retries: 6

  test:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: test
    container_name: test
    env_file:
      - postgres.env
      - nginx.env
      - api.env
    depends_on:
      api-v1:
        condition: service_healthy
    command: pnpm test
