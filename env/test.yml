name: api_starter_test

volumes:
  db: {}

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    ports:
      - '5433:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - ./test.postgres.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: api
    ports:
      - '8001:8001'
    env_file:
      - ./test.postgres.env
      - ./test.api.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [
        'CMD',
        'deno',
        'eval',
        '--allow-net',
        '--allow-env',
        "const r=await fetch(`http://localhost:$${Deno.env.get('PORT')||8000}/v$${Deno.env.get('API_VERSION')||1}`).catch(()=>null);Deno.exit(r&&r.ok?0:1)",
      ]
      interval: 1s
      timeout: 3s
      start_period: 2s
      retries: 30

  tests:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tests
    env_file:
      - ./test.postgres.env
      - ./test.api.env
    depends_on:
      api:
        condition: service_healthy
    entrypoint: [
      'deno',
      'test',
      '--allow-net',
      '--allow-env',
      '--allow-read',
      '--allow-sys',
      '--allow-import',
      '--trace-leaks',
    ]
