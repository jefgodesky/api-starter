name: api_starter_dev

volumes:
  db: {}

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    env_file:
      - ./dev.postgres.env

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: api
    command: deno task dev:start
    ports:
      - '8000:8000'
    volumes:
      - ..:/api
    env_file:
      - ./dev.postgres.env
      - ./dev.api.env
    depends_on:
      - postgres
