name: api_starter_dev

volumes:
  db: {}

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - ./dev.postgres.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: api
    command: deno task dev:start
    ports:
      - '8000:8000'
    volumes:
      - ..:/api
    env_file:
      - ./dev.postgres.env
      - ./dev.api.env
    depends_on:
      postgres:
        condition: service_healthy
