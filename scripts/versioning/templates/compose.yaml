name: api_starter_dev

volumes:
  db: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - postgres.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    volumes:
      - ./nginx:/etc/nginx/templates:ro
    env_file:
      - nginx.env
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 2s
      timeout: 2s
      retries: 15

  api-v:
    ports:
      - '8000:8000'
    env_file:
      - postgres.env
      - nginx.env
      - api.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e']
      interval: 2s
      timeout: 2s
      retries: 15
